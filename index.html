<!DOCTYPE html>
<html>
<head>
  <title>Result Check</title>
</head>
<body>

<h2>Check Result</h2>

<input type="text" id="roll" placeholder="Enter Roll No">
<button onclick="checkResult()">Check</button>

<p id="result"></p>

<script>
function checkResult() {
  let roll = document.getElementById("roll").value;

  if (roll === "123") {
    document.getElementById("result").innerText = "Pass ✅";
  } else {
    document.getElementById("result").innerText = "Result Not Found ❌";
  }
}
</script>

</body>
</html>
